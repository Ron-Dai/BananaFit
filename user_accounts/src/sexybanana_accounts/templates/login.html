<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ForgeFit</title>
  <link rel="stylesheet" href="/auth-static/auth.css">
  <script src="/auth-static/auth.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <a class="brand" href="/login" aria-label="ForgeFit sign in">
        <span class="brand-mark" aria-hidden="true">ϟ</span>
        <span>ForgeFit</span>
      </a>
      <header>
        <h1 id="page-title">Welcome back</h1>
        <p>Sign in to continue to your fitness plan.</p>
      </header>
      <form data-auth-form="login" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 placeholder="name@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 required>
        </div>
        <div class="form-message" data-form-message role="alert" aria-live="polite"></div>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <p class="switch">New to ForgeFit? <a href="/register">Create an account</a></p>
    </section>
  </main>
</body>
</html>
