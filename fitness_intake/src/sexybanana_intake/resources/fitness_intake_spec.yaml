spec:
  id: pre_exercise_health_and_function_intake
  version: 1.0.0
  language: zh-CN
  prepared_on: "2026-09-12"
  title: 训练前身体状况、健康史与功能限制采集表
  deliverable: 面向AI开发者的字段字典与处理规则；不是已填写的个人档案，也不是可直接部署的医疗诊断算法。
  objective: 为初始训练计划、适应性调整、需要补充的信息和专业转介提供依据；不生成整体运动能力排名。
  evidence_status: 综合公开专业资料设计，未进行临床验证；不声称为ACSM、NASM、WHO或其他机构的官方统一表单。
  coverage_limit: 尽可能覆盖影响运动的因素，并允许无限追加其他因素；问卷不能排除隐匿疾病，不能保证发现所有损伤或训练风险。
  age_scope: 可采集各年龄信息；未成年人及特殊生理状态不得直接套用普通成人处方和参考值。
  units_policy: 使用公制展示；保留输入原单位并执行有来源的单位换算；不得覆盖原始值。
  references_policy: source_refs指向文末资料；这些资料支持相应领域，不表示来源逐项规定了本表字段或验证了本表规则。

implementation_contract:
  format: YAML 1.2；字段行按field_columns解析；这是表单规格DSL，不是JSON Schema。
  field_columns: [id, type, label_or_question, unit, note]
  types:
    text: 字符串；保留用户原话，不将自由文本自动当作确诊。
    bool: 已作答时为true或false；未知或拒答用Answer.status表示，不用false代替。
    integer: 整数。
    number: 数字；允许零的项目必须保留真实零值。
    date: ISO 8601日期；不完整日期用Answer.date_precision标记，不能捏造月日。
    datetime: ISO 8601含时区时间；不明时区保留原文并标unknown。
    enum: 使用enum:name引用选项；选项必须显示中文label。
    multi: 使用multi:name引用多选；每个多选字段附other_text；空数组只表示明确无选项。
    measurement: 已有客观测量或估算结果；Answer.value为数值，必带measurement_metadata；是否实际检测由来源确认。
    measurements: 同一指标的多次记录；Answer.value为Answer数组，各次均有时间和方法。
    record: 使用record:name引用可重复记录；Answer.value为记录数组，各条含record_id及该record定义的答案。
    matrix: 使用matrix:name引用逐项问题；Answer.value为对象，键为矩阵项id，值为Answer；不得用一个总否定代替未回答的各项。
    refs: 指向本次记录中的record_id、answer_id或report_id数组。
  answer_contract:
    answer_id: 全局唯一字符串。
    status: answered | not_asked | unknown | not_measured | declined | not_applicable | invalid
    value: 根据字段type确定；除answered外必须为null；无效或撤回的旧值保存在审计历史中。
    unit: measurement必须提供；字段规定单位则归一化到该单位，字段unit为null时保留有定义的原单位。
    original_text: 原始回答或报告原文，可为空；不得用AI改写覆盖。
    answered_at: 作答时间。
    observed_at: 所描述事件或数值对应时间，可为空。
    date_precision: day | month | year | approximate | unknown
    source_type: self_report | clinician_report | supervised_measurement | home_measurement | wearable | derived | other | unknown
    source_detail: 提供者、报告或设备信息；临床确认与用户回忆分开。
    note: 补充说明。
    report_refs: 原报告id数组。
    related_record_ids: 与疾病、损伤、药物或限制的关联数组。
    history: 保留变更时间、前值、后值、修改者与原因；撤销不等于既往记录不存在。
    validation: unchecked | user_confirmed | source_checked | inconsistent | invalid
    measurement_metadata: measurement或measurements中的每次测量使用下方定义；非测量字段可省略。
  measurement_metadata:
    required_keys: [observed_at, date_precision, original_value, original_unit, method, device, setting, quality]
    missing_metadata: 不知道的方法或时间写unknown；仍允许保存，降低可解释性，不编造。
    original_value: 报告或用户输入原值。
    original_unit: 原单位；unit字段记录归一化单位。
    method: BIA、DXA、皮褶、卷尺、人工计脉、心电图、光电容积脉搏波、肺量计等；使用实际名称。
    device: manufacturer、model、software_version、algorithm_version、calibration_date；每项可unknown。
    assessor: 自测或测量者角色；不要求采集无关实名信息。
    setting: 居家、诊室、健身房或其他；体位、时间、测量部位、左右侧。
    preparation: 休息时长、进食饮水、近期运动、咖啡因和尼古丁、药物时间、发热或急性不适；按测量方法保留适用项。
    protocol: 方案名称与版本、重复次数、单次读数、汇总方式、有效读数数量。
    context: 疼痛、疲劳、呼吸方式、海拔、环境温度、辅助设备、测前活动；按需记录。
    estimate: is_estimated、equation_or_algorithm、input_answer_ids；未知时不得默认实测。
    quality: unknown | acceptable_per_documented_protocol | limited | invalid
    quality_reason: 仪器或操作者提供的质量依据；不能仅凭数值看似合理标记acceptable。
    reference: reference_source、version、population、reference_interval、percent_predicted、z_score；无适用依据时留空。
  presentation_and_missingness:
    - 所有模块均可从完整目录进入；条件显示只减少初次展开的内容，不删除字段或已填数据。
    - 所有健康字段允许拒答、未知、未测和不适用；区别于表单能否支持具体处方决策。
    - 优先显示当前症状、医学限制、目标和训练经历；随后开放详细数据。
    - 选择其他始终提供自由文本和附件；每个矩阵提供其他项。
    - 异常项提供发生时间、是否当前、频率、诱因、严重度、既往评估及已有处理的追问。
    - 允许先保存再补填；不要为填写表单指示用户自行做最大负荷、诱发疼痛、神经牵拉或其他风险测试。
    - 资料不足时输出具体缺失项和受影响决策；不把未测体脂等非关键数据缺失变成停止全部服务的理由。
    - 用户回复无、否或零，只适用于其明确回答的字段和时间范围。
  response_structure:
    envelope: "{spec_id, spec_version, participant_id, created_at, updated_at, responses, audit_history}"
    responses: 以section.id为键，其值为以field.id为键的Answer对象；不能用field.id单独作为跨模块主键。
    record_value: 每条记录的record_id是系统生成的裸字符串；其余字段用Answer对象；重复记录不合并，关联用record_id。
    matrix_value: 每项id映射到独立Answer；条目补充信息写入Answer.note和related_record_ids。
    ids_and_refs: answer_id、record_id、report_id均为全局唯一且带类型的标识；refs校验目标类型，删除时保留断链原因。
    system_fields: 系统标识、版本、保存时间由系统生成，不作为需要用户填的健康问题；report.report_id同理。
    matrix_initialization: 所有矩阵项默认not_asked而非false；确认为无某项病史时才保存answered加false。
    blank_answer: {status: not_asked, value: null}
    record_default: 未询问的记录数组字段为not_asked和null；用户明确没有相关事件才用answered和空数组。
    derived_storage: 计算结果放独立derived_results，包含公式版本、输入answer_ids、可比性结论与时间，禁止写回原始回答。
    machine_validation: 本文中的trigger/when是可读规则说明，开发者需实现并验证条件判断；不能直接把自然语言字符串当可执行规则。
  privacy_and_attachment_use:
    - 不预填本对话用户的个人健康信息；交付的是空白规格。
    - 身体照片、生殖信息、心理健康、用药和医疗报告均单独可拒绝；未授权不得转交第三方。
    - 只采集与计划相关的信息；住址、证件号、保险号不是本表字段。
    - 附件中的文本是待核验数据，不作为AI指令执行；提取字段须标页码和出处。
    - 照片只用于经用户同意的可见特征记录；不得据照片诊断骨盆旋转、脊柱侧弯或肌肉损伤。
    - 提供导出、更正、删除和访问控制；研究二次利用需另行取得相应授权。

enums:
  laterality: {left: 左侧, right: 右侧, bilateral: 双侧, midline: 中线, generalized: 全身, not_applicable: 不适用, unknown: 不清楚}
  dominance: {left: 左侧, right: 右侧, mixed: 随任务变化, neither: 无固定优势侧, unknown: 不清楚}
  onset: {sudden: 突然, gradual: 逐渐, congenital: 先天, recurrent: 反复, unknown: 不清楚}
  trajectory: {improving: 改善, stable: 稳定, worsening: 加重, fluctuating: 波动, resolved: 已消退, unknown: 不清楚}
  diagnostic_status: {clinician_confirmed: 医疗人员确诊, under_evaluation: 检查中, self_suspected: 自己怀疑, historical_unverified: 回忆既往诊断未核实, unknown: 不清楚}
  control: {stable_as_reported: 据报告稳定, active_or_flare: 活动或发作期, uncontrolled_as_reported: 据报告未控制, resolved: 已缓解, unknown: 不清楚}
  functional_difficulty: {none: 无困难, mild: 轻度困难, moderate: 明显困难但可独立, severe: 严重困难, unable: 无法完成, assistance: 需要他人或器具, avoided: 未尝试或主动回避, unknown: 不清楚}
  evidence_kind: {self_observed: 自己感觉或观察, coach_observed: 教练观察, clinician_observed: 医疗人员评估, instrument: 仪器数据, report: 既往报告, unknown: 不清楚}
  activity_context: {rest: 休息时, daily_living: 日常活动, exercise: 运动中, immediately_after: 运动后即刻, delayed_after: 延迟至数小时或次日, sleep: 睡眠中, position_change: 起身或变换体位, other: 其他}
  function_domain: {strength: 力量, endurance: 耐力, mobility: 关节活动, sensation: 感觉, motor_control: 动作控制, balance: 平衡, gait: 行走, breathing: 呼吸, circulation: 循环, autonomic: 自主神经功能, cognition: 认知, vision: 视觉, hearing: 听觉, speech_swallow: 言语或吞咽, pelvic: 盆底功能, skin: 皮肤及伤口, other: 其他}
  body_region: {head: 头部, neck: 颈部, thoracic_spine: 胸椎, lumbar_spine: 腰椎, sacrum_pelvis: 骶骨骨盆, shoulder: 肩, scapula: 肩胛区, upper_arm: 上臂, elbow: 肘, forearm: 前臂, wrist: 腕, hand_fingers: 手及手指, chest_ribs: 胸廓肋骨, abdomen: 腹部, hip_groin: 髋腹股沟, thigh: 大腿, knee: 膝, calf: 小腿, ankle: 踝, foot_toes: 足及足趾, pelvic_floor: 盆底会阴, whole_limb: 整个肢体, whole_body: 全身, other: 其他}
  cause: {trauma: 外伤或事故, sport: 运动损伤, repetitive_load: 重复负荷, surgery: 手术相关, immobilization: 固定卧床或废用, neurologic: 神经系统事件, cardiopulmonary: 心肺疾病, infection: 感染后, congenital: 先天或发育, degenerative: 退变, inflammatory: 炎症或自身免疫, treatment: 药物或其他治疗相关, unknown: 原因不清, other: 其他}
  goals: {strength: 增强力量, hypertrophy: 增肌, fat_loss: 减脂, weight_gain: 增重, cardio: 提高有氧耐受, health: 改善一般健康, daily_function: 改善日常功能, mobility: 改善活动范围, balance: 改善平衡, return_to_training: 恢复训练, sport: 专项运动, appearance: 体型目标, clinician_program: 执行既有医学运动方案, other: 其他}
  limitation_reason: {pain: 疼痛, weakness: 无力, numbness: 麻木或感觉减退, stiffness: 僵硬, instability: 不稳定, breathlessness: 气短, fatigue: 疲劳, dizziness: 头晕, coordination: 协调问题, fear: 恐惧或不放心, equipment: 器械或环境, medical_restriction: 医学限制, other: 其他}
  professional_role: {physician: 医师, physiotherapist: 物理治疗师或康复治疗师, exercise_physiologist: 运动生理专业人员, trainer: 教练, self: 本人, other: 其他, unknown: 不清楚}

sections:
  - id: profile
    label: 基本背景
    source_refs: [NASM_HISTORY, WHO_ICF]
    fields:
      - [participant_id, text, "使用匿名编号或昵称", null, "不要求实名"]
      - [age, number, "当前年龄", years, "可由自愿提供的出生年月推算；不能同时保留互相矛盾的年龄"]
      - [sex_for_reference, text, "如需要生理参考方程，你愿意提供的相关性别信息", null, "仅用于适用方程；不由姓名外貌推断，未知时不强行选组"]
      - [gender_pronouns, text, "称呼或性别认同偏好", null, "自愿；不用作生理计算替代值"]
      - [height, measurements, "身高及既往有效记录", cm, "使用统一测量方法"]
      - [weight, measurements, "当前及既往体重记录", kg, "注明日期、衣着和设备"]
      - [weight_change_intended, bool, "近期体重变化是否出于主动计划", null, "有变化时追问具体时间和原因"]
      - [weight_change_details, text, "近期明显增重或减重的时间、程度与原因", null, "区分饮食计划、疾病、药物、水肿及原因不明"]
      - [hand_dominance, enum:dominance, "惯用手", null, "左右比较的背景因素"]
      - [leg_dominance, enum:dominance, "踢球、支撑或起跳时的惯用腿", null, "任务相关；混合优势时补充任务"]
      - [occupation, text, "学习工作及主要体力要求", null, "记录搬举、站立、重复动作等"]
      - [altitude_environment, text, "通常训练的海拔及环境", null, "用于解释血氧、呼吸与耐热问题"]
      - [communication_access, text, "语言、阅读、视听或沟通辅助需求", null, "支持可访问的指导"]

  - id: immediate_screen
    label: 当前症状与需要优先处理的情况
    source_refs: [ACSM_EP, AHA_EMERGENCY, NHS_BACK]
    fields:
      - [current_chest_discomfort, bool, "现在是否有新出现、明显或原因不明的胸部压迫、紧缩或疼痛", null, "当前问题；阳性先执行规则R01，不等待填写完"]
      - [severe_rest_dyspnea, bool, "现在是否在休息时也明显呼吸困难", null, "当前症状；记录是否突然及伴随症状"]
      - [current_fainting_or_confusion, bool, "现在是否有昏厥、接近昏厥或新出现的意识不清", null, "区分遥远病史与当前状态"]
      - [sudden_focal_neurology, bool, "最近是否突然出现一侧肢体或面部无力麻木、说话困难或视力明显改变", null, "即使已缓解也记录首次出现时间；不得解释为肌肉不平衡"]
      - [new_saddle_sensation_change, bool, "近期是否新出现会阴、肛周或骑坐部位感觉减退", null, "与原本稳定状态比较"]
      - [new_bladder_bowel_control_change, bool, "近期是否新出现排尿困难、感觉不到尿意或大小便控制改变", null, "不得与长期已评估的运动性漏尿混为一谈"]
      - [new_bilateral_leg_neurology, bool, "近期是否出现伴腰背痛的双腿麻木、无力或迅速加重的行走困难", null, "须确认当前状态；执行R01/R02"]
      - [major_trauma_or_rapid_pain, bool, "近期是否有重大外伤、突然剧痛或迅速恶化的疼痛", null, "追问时间、部位、负重能力及是否已经就医"]
      - [current_fever_or_acute_illness, bool, "目前是否发热、急性感染或明显全身不适", null, "影响当前训练安排"]
      - [recent_emergency_events, record:event, "近期发生过需要急诊处理的事件", null, "保留医疗处置和当前状态"]
      - [screen_time, datetime, "上述当前症状确认时间", null, "不能用数月前答案代表今天"]

  - id: medical_history
    label: 疾病史与全身健康
    source_refs: [ACSM_EP, PARQ, WHO_ICF]
    fields:
      - [condition_screen, matrix:conditions, "是否曾确诊或正在评估以下情况", null, "每项独立回答；疑似写入记录，不能自动确诊"]
      - [conditions, record:condition, "逐项疾病详情", null, "每个疾病或疑似问题一条，关联残留影响"]
      - [family_history, record:family_event, "与运动有关的家族健康史", null, "侧重早发心血管病、不明原因猝死、遗传性心肌病或心律病；记录亲属关系和发生年龄"]
      - [symptoms, record:symptom, "当前及反复出现的症状", null, "不得只勾选有无；记录运动、静息和延迟反应"]
      - [symptom_screen, matrix:symptoms, "是否存在以下症状", null, "每项阳性可进入symptom记录"]
      - [hospitalization_events, record:event, "住院、重症监护、长期卧床或严重疾病经历", null, "记录时间、原因、去训练状态和出院后的残留影响"]
      - [professional_restrictions, record:restriction, "医生或康复专业人员给出的活动限制与允许范围", null, "保留原话、适用部位、有效期及复查要求"]
      - [prior_screening, record:screening_result, "已有运动前筛查问卷及结果", null, "保留原工具名称、版本、原文及结论；不能把本表称为已验证的PAR-Q+"]
      - [other_health_factors, record:other_factor, "其他未列出的疾病、健康变化或担忧", null, "开放入口，可重复添加"]

  - id: injury_history
    label: 损伤、手术和残留功能影响
    source_refs: [NASM_HISTORY, WHO_ICF, NHS_BACK]
    fields:
      - [ever_injury_or_surgery, bool, "是否有任何外伤、运动损伤、手术、固定或功能受损经历", null, "包括未就医、已恢复及先天问题"]
      - [injuries, record:injury, "每一次损伤、手术或功能受损事件", null, "不同事件分条；复发可关联原事件；见完整injury结构"]
      - [implants_and_aids, record:device_aid, "植入物、假肢、矫形器、助行器及医疗装置", null, "包括心脏起搏器、关节置换、固定物等；不据装置名称自行给出器械禁忌"]
      - [current_pain_regions, multi:body_region, "目前疼痛或不适的部位", null, "逐部位建立symptom记录，注明左右"]
      - [persistent_impairments, record:impairment, "现在仍存在的功能损伤或活动限制", null, "可关联多个疾病或事件；原因不明也允许记录"]
      - [rehabilitation_documents, refs, "康复计划、出院记录及复查报告", null, "可不上传，用文字摘要并标自报"]

  - id: function
    label: 日常功能与训练动作可及性
    source_refs: [WHO_ICF, ACSM_EP]
    fields:
      - [activities, matrix:daily_activities, "根据日常经验评估活动困难", null, "每项回答functional_difficulty并可关联symptom/impairment；不要求当场尝试"]
      - [movement_limits, record:movement_limit, "具体姿势或动作的限制", null, "记录做不了、会痛、需辅助及医生禁止的情况"]
      - [falls_last_12_months, integer, "过去12个月跌倒次数", count, "零与未回答分开"]
      - [falls_details, text, "跌倒或接近跌倒的原因、伤害和当时情境", null, "区分绊倒、头晕、无力及其他原因"]
      - [walking_tolerance, text, "通常能舒适行走多长时间或距离，因什么停下", null, "日常经验；无须测试极限"]
      - [standing_tolerance, text, "站立、起身或体位改变是否有困难", null, "记录头晕、心悸、疼痛、需要扶持等"]
      - [sitting_tolerance, text, "久坐和坐站转换是否有困难", null, "对器械坐姿和休息安排有影响"]
      - [sensory_access, text, "视力、听力、触觉、本体感觉或平衡功能方面的限制", null, "补充指导和监督需求"]
      - [cognitive_access, text, "记忆、注意、理解动作指令或判断疲劳方面的困难", null, "描述具体支持需求，不依据诊断标签推定能力"]
      - [assistance_required, text, "安全训练是否需要他人协助、监督或无障碍器械", null, "记录已有有效适应措施"]
      - [best_and_worst_days, text, "状态较好和较差时分别能完成哪些活动", null, "捕捉波动；避免只按最好一天安排"]

  - id: asymmetry
    label: 左右侧差异与代偿
    source_refs: [ACSM_EP, NHANES_DXA, WHO_ICF]
    fields:
      - [noticed_difference, bool, "是否感觉或被指出左右侧存在差异", null, "无差异感觉不等于客观完全对称"]
      - [differences, record:asymmetry_report, "每项左右差异的描述", null, "区分外观、力量、活动度、感觉、控制、疼痛和耐力"]
      - [paired_observations, record:paired_measurement, "已有同方案左右对照数据", null, "同时间、同部位、同设备和同动作条件；不强迫新增测试"]
      - [habitual_loading, text, "长期单侧运动、工作、背包、持物或避痛使用习惯", null, "作为可能背景，不直接认定病因"]
      - [compensations, text, "是否出现偏移重心、躯干旋转、耸肩、跛行或一侧抢先发力", null, "记录出现动作、负荷、次数和观察者"]
      - [limb_length_reports, text, "是否有专业测量的肢体长度差异", null, "记录方法及是否使用鞋垫等；不能据照片确认"]
      - [progressive_wasting_or_weakness, bool, "是否有一侧逐渐变细、力量持续下降或动作能力退步", null, "追问进展、麻木和专业评估；执行R06"]

  - id: body_composition
    label: 身体围度、脂肪、肌肉和相关组织数据
    source_refs: [NHANES_DXA, NASM_BODY, ACSM_EP]
    fields:
      - [circumferences, record:circumference, "身体各部位围度", null, "预置腰、臀、颈、胸、上臂、前臂、大腿、小腿；肢体部位左右独立"]
      - [body_fat_percent, measurements, "体脂率", "%", "注明BIA、DXA、皮褶或其他方法"]
      - [fat_mass, measurements, "脂肪量", kg, "实测或推算信息必须保留"]
      - [fat_free_mass, measurements, "去脂体重FFM", kg, "不是骨骼肌量"]
      - [lean_soft_tissue_mass, measurements, "瘦软组织量", kg, "保留是否排除骨矿物质；不能改名为肌肉量"]
      - [device_muscle_mass, measurements, "设备报告中的肌肉量", kg, "保留设备原指标名与定义；不可跨定义合并"]
      - [skeletal_muscle_mass, measurements, "骨骼肌量SMM", kg, "注明算法或报告定义；多数居家数据为估计"]
      - [appendicular_lean_mass, measurements, "四肢瘦组织量ALM", kg, "保留原报告定义；不与全身SMM混同"]
      - [regional_composition, record:regional_composition, "分部位身体成分", null, "左右上肢、左右下肢、躯干分别记录脂肪与瘦组织/肌肉指标"]
      - [visceral_fat, record:lab_measurement, "内脏脂肪相关数据", null, "面积cm2、体积、质量和厂商等级分开；厂商等级无统一通用阈值"]
      - [body_water, record:lab_measurement, "总身体水、细胞内外水及其他设备数据", null, "记录项目全名和单位；仅作相应方法下的背景"]
      - [bone_density, record:bone_report, "已有骨密度检查", null, "注明部位、BMD、T/Z分数及报告结论；体脂秤骨量不是骨密度"]
      - [metabolic_rate, record:lab_measurement, "静息代谢率或基础代谢率", null, "区分RMR/BMR和实测/公式/设备估算；不是每日总能量消耗"]
      - [other_device_metrics, record:lab_measurement, "其他身体测量或设备指标", null, "包括原始报告附件；厂商身体年龄等不得当作医学诊断"]

  - id: cardiovascular
    label: 心率、血压及循环状态
    source_refs: [ACSM_EP, AHA_PULSE]
    fields:
      - [resting_heart_rate, measurements, "静息心率", bpm, "安静坐位或卧位；记录体位和休息时间；不是全天平均心率"]
      - [sleeping_heart_rate, measurements, "睡眠心率", bpm, "独立于静息心率；注明设备及汇总时间窗"]
      - [day_average_heart_rate, measurements, "全天平均心率", bpm, "注明统计范围及设备，不与静息值合并"]
      - [heart_rate_variability, record:lab_measurement, "已有心率变异性HRV数据", null, "注明RMSSD或SDNN、ms、记录时长、体位和设备；不混用厂商恢复分数"]
      - [blood_pressure, record:blood_pressure, "静息血压和重复读数", null, "收缩压舒张压保持成对；测量条件见record"]
      - [orthostatic_records, record:lab_measurement, "已有卧位、坐位和站立后的心率血压记录", null, "保留每次姿势及变换后的秒数；不要指示有昏厥风险者自行挑战测试"]
      - [ecg_and_cardiac_reports, refs, "已有心电图、超声心动图、运动试验等报告", null, "保留专业结论；不由普通AI独立诊断心电图"]
      - [clinician_hr_bp_limits, refs, "专业人员给出的心率血压或强度限制", null, "关联restriction记录；没有限制不代表任意强度均适合"]
      - [circulatory_symptoms, text, "水肿、肢体发冷变色、活动时腿痛或体位相关不适", null, "补充起始时间、侧别、诱因和诊疗情况"]

  - id: respiratory
    label: 呼吸状况与已有肺功能数据
    source_refs: [ATS_ERS_SPIROMETRY, ACSM_EP]
    fields:
      - [resting_respiratory_rate, measurements, "静息呼吸频率", breaths/min, "注明休息和计数条件"]
      - [resting_spo2, measurements, "静息血氧饱和度SpO2", "%", "注明血氧仪或穿戴设备、海拔、吸氧流量和测量质量"]
      - [oxygen_therapy, text, "是否使用氧疗及已有处方", null, "保存流量、情境与专业限制；不自动调节氧流量"]
      - [spirometry, record:spirometry, "已有肺量计或肺功能检查记录", null, "包含VC/SVC、FVC、FEV1、FEV1/FVC及报告质量"]
      - [other_pulmonary_tests, record:lab_measurement, "已有TLC、DLCO、MIP/MEP等其他肺功能指标", null, "按原报告记录单位、方法及结论；不要求常规补测"]
      - [breathing_triggers, text, "冷空气、粉尘、花粉、泳池环境或运动是否诱发咳嗽喘鸣", null, "记录现有药物和行动计划，不自行诊断运动诱发支气管收缩"]
      - [inhaler_action_plan, text, "已有吸入药和呼吸症状处理方案", null, "记录医生方案，不由本表建议停药或改药"]

  - id: medication_and_exposure
    label: 药物、补充剂、过敏和物质使用
    source_refs: [ACSM_EP, NASM_HISTORY]
    fields:
      - [medications, record:medication, "处方药、非处方药和近期用过的药物", null, "包括已停用但仍有关联影响的药物；记录名称而不只问有无"]
      - [supplements, record:medication, "营养补充剂、训练前补剂及其他制剂", null, "包括咖啡因、肌酸、草药、减重产品和成分不清制剂"]
      - [allergies, record:allergy, "药物、食物、乳胶、胶带或其他过敏", null, "记录反应、严重度和既有处理方案"]
      - [tobacco_nicotine, text, "烟草、电子烟和其他尼古丁使用情况", null, "当前与既往用量、频率、停止时间"]
      - [alcohol, text, "饮酒频率、通常用量及训练前后时间", null, "保留原单位；标准杯换算需注明地区"]
      - [caffeine, text, "咖啡因来源、日常剂量和摄入时间", null, "不清楚剂量可填饮品品牌和份量"]
      - [other_substances, text, "其他可能影响运动的兴奋剂、镇静剂、激素或物质", null, "可拒答；描述用途和时间，不道德评判"]
      - [recent_changes, text, "近期药物、补充剂或物质使用的变化及不适", null, "关联心率、低血糖、出血、疼痛、嗜睡和恢复变化等，需专业解释"]

  - id: laboratory_reports
    label: 已有检查结果
    source_refs: [ACSM_EP, NHANES_DXA]
    fields:
      - [blood_tests, record:lab_measurement, "已有化验指标", null, "可选目录见lab_catalog；不是常规必检清单"]
      - [imaging_reports, refs, "与运动限制有关的X线、MRI、CT、超声等报告", null, "原结论与用户当前症状分开；影像异常不自动等于不能运动"]
      - [neurological_tests, refs, "已有肌电图、神经传导或其他神经功能报告", null, "不要求用户自行做检查"]
      - [clinical_summary, text, "专业人员对已有检查的解释及训练相关意见", null, "保存来源与日期；AI不可把参考区间外数值直接变成处方"]
      - [pending_evaluation, text, "尚在等待的检查、复诊或诊断", null, "标明哪些决策依赖后续结果"]

  - id: reproductive_and_hormonal
    label: 与训练相关的生理和激素状态
    source_refs: [ACSM_EP, NASM_HISTORY]
    fields:
      - [relevance, bool, "是否愿意补充可能影响运动的生殖或激素相关情况", null, "不按性别认同强制隐藏或展开"]
      - [pregnancy_status, text, "如适用，是否妊娠、可能妊娠或正在确认", null, "可不提供；不推断"]
      - [gestational_age, number, "如妊娠，当前孕周", weeks, "优先引用医疗信息"]
      - [pregnancy_complications, text, "与孕期活动相关的并发症及专业限制", null, "出现当前明显异常症状转入症状与优先处理模块"]
      - [postpartum_details, text, "产后时间、分娩方式、伤口恢复及专业意见", null, "包括盆底、腹部和切口症状"]
      - [breastfeeding, bool, "是否哺乳", null, "用于恢复、舒适度和营养背景"]
      - [menstrual_pattern, text, "如适用，月经规律、近期变化或停经", null, "不得单凭月经变化诊断能量不足"]
      - [cycle_related_effects, text, "经期或周期相关的疼痛、疲劳、出血及训练影响", null, "根据个人经验调整，不预设统一周期训练规则"]
      - [menopause, text, "如适用，围绝经期或绝经相关症状", null, "记录睡眠、体温和骨健康背景"]
      - [hormonal_therapy, refs, "激素治疗或避孕药相关记录", null, "关联medication，不自行更改"]
      - [pelvic_floor_symptoms, text, "运动时漏尿、盆底疼痛、下坠感或其他不适", null, "记录触发动作；急性神经症状按R01，不能一概解释为盆底问题"]

  - id: nutrition_recovery
    label: 营养、能量摄入、睡眠和恢复
    source_refs: [NASM_HISTORY, ACSM_EP, CDC_PEM, NICE_MECFS]
    fields:
      - [diet_pattern, text, "日常饮食模式和进餐规律", null, "记录实际模式，不用笼统健康分数替代"]
      - [energy_intake, record:lab_measurement, "已有能量摄入估计或饮食记录", null, "注明日记、软件或营养师估算，不把缺失补为默认热量"]
      - [protein_intake, record:lab_measurement, "已有蛋白质摄入记录或估计", null, "注明g/day或g/kg/day及方法"]
      - [food_restrictions, text, "过敏、不耐受、宗教、素食或医疗饮食限制", null, "关联allergy和医学限制"]
      - [hydration, text, "日常饮水、训练出汗、脱水或医生限水情况", null, "限水情况优先遵循医疗方案"]
      - [appetite_gi, text, "食欲、恶心、反流、腹泻、吸收或吞咽方面的问题", null, "记录与活动或进餐的关系"]
      - [restrictive_or_compensatory_behaviors, text, "是否存在明显限制进食、暴食、催吐或用运动补偿进食的情况", null, "可拒答；不据此自动诊断或制定激进减脂方案"]
      - [possible_underfueling, text, "是否持续疲劳、频繁伤病、反复应力性骨损伤或因进食不足影响训练", null, "症状非特异，需结合其他信息"]
      - [sleep_hours, number, "通常每日睡眠时长", hours/day, "标明近期平均时间窗"]
      - [sleep_quality, text, "入睡、夜醒、醒后恢复和白天嗜睡情况", null, "注明打鼾、睡眠呼吸暂停诊断及治疗"]
      - [shift_work, text, "倒班、熬夜、时差及作息变化", null, "用于安排训练时段和恢复"]
      - [fatigue_baseline, text, "日常疲劳程度、持续时间和对生活的影响", null, "不只记录运动当时"]
      - [delayed_exacerbation, bool, "轻微体力或脑力活动后，是否会在数小时或次日出现明显且持久的全身症状加重", null, "筛查PEM/PESE可能性；不等同于普通局部延迟性肌肉酸痛"]
      - [delayed_exacerbation_details, text, "哪些活动引起加重、延迟多久、持续多久、出现哪些症状及恢复方式", null, "阳性触发R07；不要默认按固定比例每周加量"]
      - [orthostatic_intolerance, bool, "站立或起身是否反复引起头晕、心悸、乏力或接近昏厥", null, "记录既往诊断和允许的体位，不让用户自测到晕厥"]
      - [recent_infection_recovery, text, "感染后是否有持续心肺、疲劳、认知或其他功能变化", null, "包含COVID及其他感染；病因不得仅由问卷判断"]

  - id: psychosocial_environment
    label: 心理、环境和可执行条件
    source_refs: [WHO_ICF, NASM_HISTORY]
    fields:
      - [stress, text, "当前压力及对睡眠、恢复或坚持训练的影响", null, "使用自报；非诊断量表"]
      - [mental_health_support, text, "你愿意提供的心理健康情况及训练支持需求", null, "可拒答；不要求叙述创伤细节"]
      - [fear_and_pain_expectations, text, "对运动、受伤或疼痛是否有顾虑", null, "记录可接受的解释和监督方式"]
      - [body_image_preferences, text, "体重、围度、照片或身体外观讨论是否造成不适", null, "允许不展示相关指标而保留用户愿意提供的字段"]
      - [exercise_compulsion, text, "是否难以休息、带伤强迫训练或因漏练明显焦虑", null, "影响计划执行和恢复；不自动贴标签"]
      - [support_and_access, text, "家人同伴、交通、照护、费用或无障碍条件", null, "记录实际障碍和已有解决办法"]
      - [environmental_triggers, text, "高温寒冷、海拔、空气质量、过敏原或噪声等影响", null, "关联呼吸、感觉和体温调节问题"]
      - [equipment_accessibility, text, "器械尺寸、上下器械、抓握及辅助装置兼容性", null, "包含假肢、轮椅、握带等适配需求"]
      - [touch_and_media_preferences, text, "对肢体接触辅助、拍照录像和线上评估的接受范围", null, "每种方式单独可拒绝"]

  - id: activity_history
    label: 当前活动及既往训练
    source_refs: [NASM_HISTORY, ACSM_EP]
    fields:
      - [current_activities, record:activity, "目前实际进行的运动与日常体力活动", null, "频率、时长、主观强度和症状；不强迫运动测试"]
      - [sedentary_time, number, "通常每日久坐时间", hours/day, "注明估算或设备记录"]
      - [steps, measurements, "已有日均步数", steps/day, "记录设备及统计时间窗；不用步数等同全部活动量"]
      - [training_history, text, "过去训练类型、持续时间和学习过的动作", null, "区分当前熟练度与多年前经验"]
      - [recent_break, text, "最近中断训练的时长和原因", null, "包含受伤、疾病、工作及其他原因"]
      - [prior_program_response, text, "哪些计划有效，哪些引起疼痛、疲劳、受伤或难以坚持", null, "保留具体情境"]
      - [usual_working_loads, record:existing_performance, "已知常用训练重量、次数及实际感受", null, "是已有经验，不要求测试1RM"]
      - [existing_fitness_tests, record:existing_performance, "自愿提供的已有握力、单侧力量、耐力、活动度及其他测试", null, "记录日期、协议、左右侧；无需以整体能力排名为目标"]
      - [existing_cpet, record:existing_performance, "已有VO2max/VO2peak、通气阈值或心肺运动试验数据", null, "实测与设备预测分开；保留专业解释及阈值对应心率功率"]
      - [exercise_adverse_history, text, "运动中或之后的不良反应与受伤经历", null, "包括胸痛、昏厥、喘鸣、异常无力、严重过热等；关联症状记录"]

  - id: goals_and_constraints
    label: 训练目标与安排条件
    source_refs: [NASM_HISTORY, ACSM_EP, WHO_ICF]
    fields:
      - [goals, multi:goals, "希望通过训练实现什么", null, "选择后记录优先级和具体生活意义"]
      - [goal_details, record:goal, "每个目标的优先级、预期和时间", null, "区分用户愿望和已评估的可行性"]
      - [days_per_week, integer, "每周实际可训练天数", days/week, "0至7"]
      - [session_duration, number, "每次可安排时间", min, "包含热身、休息和准备"]
