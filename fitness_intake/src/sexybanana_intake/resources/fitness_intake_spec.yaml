lab_catalog:
  policy: 仅帮助用户选择已有指标和导入报告；不表示这些项目都需要检测，也不作为无差别补检建议。
  options:
    - "空腹或随机血糖、HbA1c；注明采样条件"
    - "总胆固醇、LDL-C、HDL-C、甘油三酯"
    - "血红蛋白、血细胞比容、红细胞相关指标"
    - "已有铁蛋白、转铁蛋白饱和度等铁状态结果"
    - "肌酐、eGFR及已有其他肾功能结果"
    - "已有肝功能、电解质、甲状腺或其他内分泌结果"
    - "已有维生素或营养状态相关结果"
    - "其他由专业人员认为与该用户活动或恢复有关的指标"
  interpretation: 记录原单位、参考范围、采样时间和医疗结论；不得因疲劳等非特异症状自动要求所有项目或自行诊断。

branching:
  semantics: 条件仅决定追问优先级；所有字段保持可访问；对unknown不作阳性或阴性断言。
  rules:
    - {id: B01, when: "condition_screen中任一项为true", then: "为相应情况建立condition记录，追问确诊依据、当前状态、治疗、活动影响和限制。"}
    - {id: B02, when: "损伤、手术、住院、固定、严重感染、脑或脊髓事件、先天差异或不明原因功能下降被报告", then: "建立相应event/injury/condition和impairment关联；逐项问事件前能力、当前能力、恢复及残留影响。"}
    - {id: B03, when: "疼痛、麻木、无力或左右差异被报告", then: "追问具体位置、侧别、发生时间、当前状态、进展、触发动作和医疗评估；必要时先执行优先处理规则。"}
    - {id: B04, when: "用户报告左右侧不同或提供可配对数据", then: "建立asymmetry_report和可用的paired_measurement；没有测量时保留主观差异，不填虚构数值。"}
    - {id: B05, when: "存在药物、补剂或植入装置", then: "追问名称、时间、已有注意事项和相关症状；具体影响需核验实际药物或设备资料，禁止单凭类别硬编码禁忌。"}
    - {id: B06, when: "心肺症状、昏厥、体位不耐受或近期心肺事件被报告", then: "优先核实目前症状、近期诊疗、用药及允许活动；已有心率血压肺功能数据进入对应模块。"}
    - {id: B07, when: "活动后延迟全身症状加重", then: "追问活动量、延迟时长、持续天数、伴随症状和原有诊疗；执行R07。"}
    - {id: B08, when: "日常活动困难或需要辅助", then: "追问难点、患侧、具体原因、可耐受变式、需要的协助及已有康复意见。"}
    - {id: B09, when: "妊娠、产后、长期停经、骨健康或能量摄入担忧被报告", then: "自愿展开相应生理、营养和已有专业意见；不从性别或单个指标推断状态。"}
    - {id: B10, when: "上传报告或穿戴设备导入", then: "先解析指标原名、单位、日期、方法、质量和出处；用户确认或核验前标记unverified，禁止覆盖冲突的自报。"}
    - {id: B11, when: "任一关键问题为unknown或declined", then: "记录受影响决策，提供自愿补充入口；不得连续强迫追问或把拒答推断为患病。"}
    - {id: B12, when: "新症状、新诊断、药物变更、损伤、妊娠状态改变或长时间中断训练", then: "重评相关模块并使旧摘要标记needs_update；不清空历史记录。"}

interpretation_rules:
  status: 以下为开发设计逻辑，不是已验证的自动医疗分诊系统；临床阈值或疾病专用处方上线前需按目标人群和当前规范审核。
  precedence: 当前紧急表现优先于既往正常报告；明确医学限制优先于训练目标；时间、来源和当前变化必须同时考虑。
  rules:
    - id: R01
      source_refs: [AHA_EMERGENCY, NHS_BACK]
      inputs: [immediate_screen, medical_history.symptoms]
      trigger: "疑似当前心肺急症表现，或新出现的卒中样局灶神经症状，或新发会阴感觉/排尿排便控制异常及脊柱神经警示表现。"
      clarification: "记录症状是否当前、发生时刻和是否已接受评估；对已明确急性危险表现不得等待补齐问卷。长期稳定且已评估的残留症状不自动当作新急症。"
      action: "中止新的训练和测试建议，明确提示立即寻求当地急救/急诊评估；根据所在地显示号码，不固定所有国家使用911。保存触发答案；不要给出心梗、卒中或马尾综合征确诊。"
    - id: R02
      source_refs: [ACSM_EP, NHS_BACK]
      inputs: [medical_history.symptoms, immediate_screen.major_trauma_or_rapid_pain, medical_history.professional_restrictions]
      trigger: "原因不明的运动相关胸部不适或昏厥、明显进展的无力/麻木、快速恶化疼痛、重大外伤后功能下降，且当前信息不足以解释。"
      action: "提示及时专业评估；若具有R01的当前紧急表现则升级。暂停与该问题相关的负荷或强度决策，记录尚可讨论的非冲突部分。不能简单分成所有疾病均禁练或全部可练。"
    - id: R03
      source_refs: [ACSM_EP, PARQ]
      inputs: [medical_history.conditions, medical_history.prior_screening, activity_history.current_activities, goals_and_constraints.goals]
      trigger: "存在已知疾病或筛查工具阳性答案。"
      action: "依据疾病当前状态、现有症状、既往活动、拟进行强度和原工具后续流程判断下一步；不把每个阳性回答都等同必须禁练或必须取得同一种许可。缺少所需信息则具体追问。"
    - id: R04
      source_refs: [DESIGN, ACSM_EP]
      inputs: [medical_history.professional_restrictions, injury_history.injuries]
      trigger: "存在已记录的专业活动限制，或多个意见冲突。"
      action: "保留原话并转换成明确的动作、负荷、体位、时长和部位约束；转换内容与原文区分。冲突或有效性不明时核实；不能由AI解除限制或依据到期日期直接放开。"
    - id: R05
      source_refs: [DESIGN, NHANES_DXA, ACSM_EP]
      inputs: [asymmetry.differences, asymmetry.paired_observations, injury_history.injuries, function.movement_limits]
      trigger: "存在主观或测量的左右差异。"
      action: "先检查可比性，再报告差异及不确定性。综合个人基线、惯用侧、任务、疼痛、感觉、控制、损伤和测量误差；没有适用证据时不以10%、15%等统一阈值诊断。不得自动增加所谓弱侧训练量，不假定完全对称是每个人的目标。"
    - id: R06
      source_refs: [DESIGN, WHO_ICF, NHS_BACK]
      inputs: [asymmetry.progressive_wasting_or_weakness, injury_history.persistent_impairments, medical_history.symptoms]
      trigger: "新发或持续加重的单侧变细、无力、感觉改变、足下垂样表现或功能退步。"
      action: "先核实时间和伴随症状，标记需要专业评估；急性局灶表现按R01。不要自动解释为训练不足、姿势差或简单肌肉失衡。"
    - id: R07
      source_refs: [CDC_PEM, CDC_LONG_COVID, NICE_MECFS]
      inputs: [nutrition_recovery.delayed_exacerbation, nutrition_recovery.delayed_exacerbation_details, medical_history.conditions]
      trigger: "存在轻微活动后延迟、持续的全身症状加重，疑似PEM/PESE。"
      action: "记录触发剂量和恢复模式，建议相应专业评估并结合已有管理方案；不能从问卷确诊ME/CFS或长新冠。不要默认以固定增量的训练进阶处理，也不要为获取数据要求极限测试。"
    - id: R08
      source_refs: [DESIGN, ACSM_EP]
      inputs: [medication_and_exposure.medications, cardiovascular, nutrition_recovery, reproductive_and_hormonal]
      trigger: "药物、特殊生理状态、症状或疾病可能影响心率、负荷耐受、代谢或恢复。"
      action: "明确哪些计算或建议的前提不再成立；核实实际药物、病情和专业方案。例如不能无条件用年龄预测最大心率来给服用影响心率药物者划区间。禁止自行停药或更改治疗。"
    - id: R09
      source_refs: [NHANES_DXA, ATS_ERS_SPIROMETRY, DESIGN]
      inputs: [body_composition, cardiovascular, respiratory]
      trigger: "身体指标需要解释或用于追踪。"
      action: "核实构念、日期、设备、单位和条件。脂肪量、去脂体重、瘦软组织和骨骼肌分别解释；围度可能受脂肪和水肿影响；肺活量不替代VO2max；静息心率不替代全天平均。禁止把设备评分直接当医学诊断。"
    - id: R10
      source_refs: [DESIGN]
      inputs: [reports_and_update.reports, profile, body_composition, cardiovascular, respiratory, laboratory_reports]
      trigger: "单位缺失、异常输入、数据冲突或来源质量不足。"
      action: "保留原值，标记问题并追问或核对报告；不静默修正、平均矛盾数据或裁剪到正常区间。标记为危急值的原报告应优先提示依其专业处置建议处理；若后续增加数值阈值规则，须另行维护经审核的适用指南与版本，不能从本表推导阈值。症状提示紧急情况时，核对设备不能延误R01处理。"
    - id: R11
      source_refs: [DESIGN, WHO_ICF, ACSM_EP]
      inputs: [injury_history, function, goals_and_constraints]
      trigger: "存在长期稳定的残障、先天差异、义肢或已知功能损伤。"
      action: "依据实际能力、个人目标、辅助方式和专业限制设计适配需求；不因为诊断标签推定无法训练，不把所有差异视为需要矫正。"
    - id: R12
      source_refs: [DESIGN]
      inputs: [reports_and_update.changes_since_last, reports_and_update.user_corrections]
      trigger: "关键数据发生变化、更正或撤回。"
      action: "使依赖旧数据的推断和处方依据失效并重新计算，保存历史和版本；用户更正不悄悄删除既往已执行方案。"
    - id: R13
      source_refs: [DESIGN, ACSM_EP]
      inputs: [goals_and_constraints, activity_history, immediate_screen, medical_history.professional_restrictions]
      trigger: "需要形成初始计划输入，但部分测量为空。"
      action: "按决策逐项判断数据充足性。未测体脂或肺活量不自动阻止初始计划；当前症状、限制或损伤情况未澄清时，不给出依赖这些前提的高强度、最大负荷或受伤部位进阶建议。"

derived_metrics:
  semantics: 仅对answered且有效、时间和测量条件适合的数据计算；保留输入answer_id、公式、单位及时间。派生值不能覆盖原始值。
  entries:
    - id: bmi
      formula: "weight_kg / (height_cm / 100)^2"
      unit: kg/m2
      prerequisites: "身高>0、体重>0；年龄与特殊生理状态只影响解释，不改变原始公式。"
      limitations: "不直接代表体脂或肌肉；不自动套用普通成人参考线到儿童或妊娠。"
    - id: waist_hip_ratio
      formula: "waist_cm / hip_cm"
      unit: ratio
      prerequisites: "相近时间且方法明确；hip_cm>0。"
      limitations: "记录腰围和臀围测量位置。"
    - id: waist_height_ratio
      formula: "waist_cm / height_cm"
      unit: ratio
      prerequisites: "单位相同，height_cm>0。"
      limitations: "是否解释及参考值需根据适用人群确定。"
    - id: fat_mass_from_percent
      formula: "weight_kg * body_fat_percent / 100"
      unit: kg
      prerequisites: "同一时间和相容来源，体脂率在0至100之间；0或100需质量核实。"
      limitations: "明确标为由体脂率推算，不称独立测量。"
    - id: fat_free_mass_from_percent
      formula: "weight_kg - fat_mass_from_percent"
      unit: kg
      prerequisites: "同上。"
      limitations: "不能把此值当骨骼肌量。"
    - id: paired_signed_difference
      formula: "right - left"
      unit: 与原指标相同
      prerequisites: "同构念、同方案、同单位、相近时间、相容体位及用力条件；否则不计算，输出不可比原因。"
      limitations: "正负仅表示左右数值关系，不等于强弱或病理。"
    - id: paired_absolute_difference
      formula: "abs(right - left)"
      unit: 与原指标相同
      prerequisites: "同上。"
      limitations: "与测量误差、个人基线和任务相关性一起呈现。"
    - id: paired_relative_difference
      formula: "100 * abs(right - left) / max(left, right)"
      unit: "%"
      prerequisites: "左右>=0，max(left,right)>0，指标为有真实零点且允许比例解释的量，并满足可比性条件。"
      limitations: "这是本系统明确选用的一种差异描述公式，不是统一临床标准；不同分母的文献阈值不能移用。带符号ROM、z分数、量表和厂商评分不自动使用该公式。两侧均0时结果为null。"
    - id: longitudinal_change
      formula: "current - prior"
      unit: 与原指标相同
      prerequisites: "指标定义和方法相容；显示两次日期、设备及条件变化。"
      limitations: "数值变好不自动等于临床恢复；疑似不相容数据分开展示。"
  not_automatically_derived:
    - 不根据身高体重、肌肉量或肺活量直接推出训练重量、1RM、VO2max或康复阶段。
    - 不将有症状侧与对侧的比值默认解释为恢复百分比；双侧均受损时对侧不一定是健康参考。
    - 不从体脂秤骨量推出骨密度或骨折风险；不把厂商身体年龄作为生理年龄。
    - 无适用方程、人群和方法证据时，不给FFMI、ALMI或其他指数附加诊断阈值。

output_contract:
  purpose: 交给训练计划模块的结构化摘要；输出内容必须可追溯，不能只给一个综合风险分。
  keys:
    participant_id: 匿名编号。
    spec_version: 所用规格版本。
    data_as_of: 本次汇总时间与症状最近确认时间。
    evidence_summary: 已知事实、用户自述、来源未核实和计算结果分别列出。
    health_factors: 疾病、症状、药物、特殊状态及当前控制情况。
    injury_and_impairment_map: 每次事件到当前残留功能、患侧、受限任务和已有措施的关联。
    asymmetry_summary: 差异类型、原始左右值、比较条件、计算公式、变化趋势和不能确定的部分。
    current_constraints: 专业原始限制、来源、时间、解释及不确定性。
    adaptations_needed: 场地、器械、沟通、监督、辅助和动作适配需求。
    goals_and_resources: 优先目标、时间、器械、偏好及执行条件。
    flags: 标记数组；每项含rule_id、描述、severity、相关answer_ids、依据、建议下一步和是否已处理。
    missing_and_conflicting_data: 每项含字段路径、缺失/冲突原因、受影响决策及自愿补充问题。
    followup_questions: 按紧急性和对计划影响排序；已拒答的问题不重复施压。
    planning_scope: 可讨论或可初步安排的范围、暂不能确定的范围及各自理由。
    needs_review: 建议何种专业评估、针对什么问题及所需资料；不写无法由本表支持的确诊。
    reassessment_triggers: 新症状、恢复变化、药物变动、生活或训练变动等。
  flag_severity: emergency | prompt_professional_review | clarification_needed | adaptation_needed | monitoring_note
  negative_result_wording: "本次已提供信息未触发所列警示规则；未评估项仍未知。"
  forbidden_outputs:
    - "已排除所有健身风险、没有功能损伤、完全健康或医学许可已获批等无法支持的结论。"
    - "仅凭围度、照片、肌肉量或通用差异百分比确诊肌肉失衡及具体病因。"
    - "以未提供的体脂、心率、病史、检验结果作为正常值参与决策。"
    - "把有填写入口等同于必须接受该项检测。"
    - "把用户自报伤病当成已核实诊断，或把过去恢复解释为当前无限制。"

validation_requirements:
  schema:
    - 所有section.id和同一容器内field.id唯一；每行字段必须有5列。
    - enum、multi、record、matrix和source_refs必须能解析；禁止引用未定义类型。
    - bool只能接受布尔值；类型转换不可把字符串unknown或空字符串转成false。
    - 非answered答案value必须为null；已有无效值保存为原始证据且禁止参与计算。
    - record数组支持多次事件与多时间点，不得以单个文本框覆盖历史。
  measurements:
    - 不完整日期保留精度；禁止自动补成当年1月1日后当作精确日期。
    - 百分比、比例、kg/g、cm/m、L/mL和L/s与L/min必须显式转换并保留原值。
    - 体重和身高的负值、心率负值、百分比超出物理范围等标记需核实；不能自动替换或删去。
    - 检查舒张压与收缩压成对、同次、同侧；异常关系先检查录入和原报告。
    - 部位、侧别、计量构念或测量方法不明的数据可以存储，但不自动作左右或纵向比较。
    - 默认没有全球通用正常值库；如后续加入，须记录指南版本、适用人群、测量条件及审查日期。
  required_behavior_cases:
    - "体脂未测但当前筛查和计划相关信息已提供：保存并继续，不伪造体脂，不强制检测。"
    - "体脂已填但伤病/症状拒答：记录不确定性，不宣称可据此制定完整负荷方案。"
    - "左侧瘦软组织与右侧骨骼肌量：阻止直接比较。"
    - "左右同方法握力30和25kg：绝对差5kg，相对差16.666...%；仅描述差异，不自动判定病理。"
    - "左右均0或一侧缺失：相对差为null，不输出0%或无限值。"
    - "多年前手术但目前功能良好：保留事件，不自动急诊或永久禁练。"
    - "突然单侧无力：不进入普通弱侧加练流程，执行R01。"
    - "新发腰背痛伴会阴感觉或排尿改变：优先警示，不给拉伸或悬挂等处方。"
    - "有PEM样延迟加重：不默认固定周增量或强行力竭测试。"
    - "药物影响心率且仅有年龄：不得伪装成精确心率训练区间。"
    - "正常体脂、心率或影像但有明显症状：不得用正常数据否定症状。"
    - "用户修正患侧、单位或日期：所有相关差值、摘要和约束重新计算并保留版本。"

sources:
  DESIGN:
    title: 本表原创开发设计
    url: null
    scope: 字段组合、缺失状态、数据模型、追问、输出格式和无证据时的限制；未经独立临床验证。
  NASM_HISTORY:
    title: NASM Lifestyle and Health History Questionnaire
    url: https://www.nasm.org/content/dam/nasm/docs/nasmlibraries/pdf/cpt7-lifestyle-and-health-history-handout.pdf
    access: 公开PDF，3页
    scope: 初始健康史、生活方式、训练背景和目标。
  NASM_BODY:
    title: NASM Body Composition Measurement
    url: https://www.nasm.org/content/dam/nasm/docs/nasmlibraries/pdf/cpt7-body-composition-assessment-template.pdf
    access: 公开PDF，1页
    scope: 身高体重、围度、皮褶及体脂记录。
  ACSM_EP:
    title: ACSM Certified Exercise Physiologist Exam Content Outline
    url: https://acsm.org/wp-content/uploads/2024/12/ACSM-Certified-Exercise-Physiologist-Exam-Content-Outline.pdf
    access: 公开PDF，2025年7月10日生效版本
    scope: 健康筛查、评估方法、心率血压、身体成分及个体化运动处方的专业能力框架；不是完整处方手册或本表的逐项规范。
  ACSM_CPT:
    title: ACSM Certified Personal Trainer Exam Content Outline
    url: https://acsm.org/wp-content/uploads/2024/12/ACSM-Certified-Personal-Trainer-Exam-Content-Outline.pdf
    access: 公开PDF，2025年7月10日生效版本
    scope: 训练前咨询、筛查、评估和计划的专业能力框架。
  ACSM_MANUAL:
    title: ACSM Fitness Assessment Manual官方介绍
    url: https://acsm.org/education-resources/books/fitness-assessment-manual/
    access: 公开介绍，书籍全文并非本次免费获取资料
    scope: 评估领域分类；不声称已读取完整书籍。
  PARQ:
    title: PAR-Q+及ePARmed-X+用途和后续筛查说明
    url: https://www.healthlinkbc.ca/living-well/physical-activity/general-information-and-tools/tools-and-resources/par-q-and-eparmed-x
    original_form_url: https://eparmedx.com/wp-content/uploads/2025/01/PARQPlus2025ImageFile.pdf
    access: 公开说明及2025版本问卷链接；正式使用工具时核验当前版本与使用条件。
    scope: 运动前准备度与后续筛查思路；本表没有复制原工具并沿用其验证地位。
  NHANES_DXA:
    title: CDC NHANES 2017–2018 Whole Body DXA Data Documentation and Codebook
    url: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/DXX_J.htm
    access: 公开数据字典和测量质量说明
    scope: 脂肪、瘦组织、骨矿物质、全身及分部位数据，以及无效测量和来源记录。
  ATS_ERS_SPIROMETRY:
    title: Standardization of Spirometry 2019 Update — ATS/ERS Technical Statement
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6794117/
    access: 公开全文
    scope: VC、FVC、FEV1等定义、测量条件、可接受性、重复性及报告要求。
  AHA_PULSE:
    title: American Heart Association — All About Heart Rate
    url: https://www.heart.org/en/health-topics/high-blood-pressure/the-facts-about-high-blood-pressure/all-about-heart-rate-pulse
    access: 公开说明
    scope: 静息心率的含义及相关影响因素。
  WHO_ICF:
    title: WHO International Classification of Functioning, Disability and Health
    url: https://www.who.int/standards/classifications/international-classification-of-functioning-disability-and-health
    access: 公开框架介绍和进一步资源
    scope: 将身体功能、活动和环境共同纳入记录的框架；本表不声称完成正式ICF编码或量表评估。
  AHA_EMERGENCY:
    title: American Heart Association — Heart Attack and Stroke Symptoms
    url: https://www.heart.org/en/about-us/heart-attack-and-stroke-symptoms
    access: 公开说明
    scope: 当前心肺急症和突然局灶神经症状的警示信息。
  NHS_BACK:
    title: NHS — Back pain
    url: https://www.nhs.uk/conditions/back-pain/
    access: 公开说明，页面标示2026年3月复核
    scope: 腰背痛伴神经、会阴、膀胱肠道变化等需要及时或紧急评估的表现。
  CDC_PEM:
    title: CDC — Strategies to Prevent Worsening of Symptoms in ME/CFS
    url: https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html
    access: 公开临床指导
    scope: 活动后延迟症状加重及活动管理背景。
  CDC_LONG_COVID:
    title: CDC — Long COVID Clinical Guidance
    url: https://www.cdc.gov/long-covid/hcp/clinical-guidance/index.html
    access: 公开临床指导，页面标示2026年3月更新
    scope: 个体化功能与症状记录；正常检查不能单独排除持续症状；PEM可能延迟出现。
  NICE_MECFS:
    title: NICE NG206 — ME/CFS Recommendations
    url: https://www.nice.org.uk/guidance/ng206/chapter/recommendations
    access: 公开指南；本次通过官方搜索索引核对相关建议，全文访问受限。
    scope: ME/CFS中不使用固定递增活动量的通用方案；不得扩大解释为所有疲劳者都患ME/CFS。
  CHINA_FITNESS:
    title: 国民体质测定标准（2023年修订）
    url: https://www.sport.gov.cn/n315/n20001395/c25880704/part/25880716.pdf
    access: 公开PDF，68页
    scope: 可保留用户已有体测记录及原评分依据；本表不要求执行全套测试，不将总体体质评分作为训练准入条件。
